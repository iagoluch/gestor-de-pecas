name: E2E (Playwright)

# Sob demanda — não bloqueia CI nem deploy. Adotado com escopo mínimo (1
# smoke test); ver docs/CLAUDE_CODE_SETUP.md para a decisão e o critério de
# quando vale ampliar a suíte.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Subir o preview visual (self-contained, sem banco)
        run: |
          python -m uvicorn tests.web_preview_api:app --host 127.0.0.1 --port 8010 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8010/ >/dev/null 2>&1 && break
            sleep 1
          done
      - run: python -m pytest tests/test_e2e_smoke.py -v
