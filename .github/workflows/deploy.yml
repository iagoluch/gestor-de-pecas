name: Deploy

# Dispara só por tag de release (ex.: `git tag v1.2.0 && git push --tags`),
# nunca em push comum na master — decisão do usuário, para não implantar em
# produção algo que ainda está em teste.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Gate real: chama o CI (backend + frontend + security) como workflow
  # reutilizável para o MESMO commit da tag, uma única vez (ci.yml ignora
  # pushes de tag no próprio trigger `push`, então não roda em duplicidade).
  # Nenhum job de deploy abaixo inicia sem isto ter passado.
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-frontend:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist

  deploy:
    needs: [validate, build-frontend]
    # Roda no runner self-hosted instalado NA PRÓPRIA VM (Windows Server
    # 2025 — decisão da infra, 21/09/2026): ela fica atrás de firewall, sem
    # IP público, só com RDP/administração interna (ver requisitos de
    # infraestrutura). Um runner self-hosted puxa o job de dentro para
    # fora, sem precisar abrir porta de entrada nenhuma.
    #
    # Pré-requisito (ainda pendente — VM não provisionada): instalar o
    # runner do GitHub Actions para Windows na VM com a label
    # "gestor-pecas-vm" (Settings > Actions > Runners > New self-hosted
    # runner no repositório, escolhendo Windows).
    runs-on: [self-hosted, Windows, gestor-pecas-vm]
    env:
      APP_DIR: C:\gestor-pecas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      # scripts/deploy_release.ps1 (BK-08; provado por
      # scripts/test_deploy_rollback.ps1):
      #   1. snapshot de APP_DIR (com .venv) em APP_DIR.previous;
      #   2. pg_dump do banco ANTES do restart: as migrations rodam no startup
      #      (auto_migrate) e não têm down; sem dump, não há deploy;
      #   3. para o serviço, espelha o código (.env e dados de runtime ficam
      #      fora do /MIR), instala o lock com hashes e sobe o serviço;
      #   4. espera /ready; se não ficar pronto, volta código + .venv do
      #      snapshot. O banco NUNCA é restaurado sozinho: se o código antigo
      #      recusar o schema novo, o job falha com o caminho do dump.
      # O serviço "gestor-pecas" é registrado via NSSM (nssm.cc).
      # Pré-requisito da VM: pg_dump no PATH e DATABASE_URL no .env.
      - name: Implantar com backup do banco e rollback de código
        shell: pwsh
        run: |
          & .\scripts\deploy_release.ps1 -Source . -AppDir $env:APP_DIR `
            -BackupDatabase {
              $linha = Get-Content -LiteralPath "$env:APP_DIR\.env" | Where-Object { $_ -match '^\s*DATABASE_URL\s*=' } | Select-Object -First 1
              $dsn = ($linha -replace '^\s*DATABASE_URL\s*=\s*', '').Trim().Trim('"', "'")
              if (-not $dsn) { throw "DATABASE_URL ausente no .env da VM: sem backup não há deploy." }
              $pasta = Join-Path $env:APP_DIR "backups"
              New-Item -ItemType Directory -Force -Path $pasta | Out-Null
              $arquivo = Join-Path $pasta ("pre-deploy-{0}-{1:yyyyMMdd-HHmmss}.dump" -f $env:GITHUB_REF_NAME, (Get-Date))
              pg_dump --format=custom --file "$arquivo" --dbname "$dsn"
              if ($LASTEXITCODE -ne 0) { throw "pg_dump falhou ($LASTEXITCODE): deploy abortado sem tocar no serviço." }
              $arquivo
            } `
            -InstallDependencies {
              & "$env:APP_DIR\.venv\Scripts\pip.exe" install --require-hashes -r "$env:APP_DIR\requirements.lock"
              if ($LASTEXITCODE -ne 0) { throw "pip install do requirements.lock falhou ($LASTEXITCODE)." }
            } `
            -StopService { Stop-Service -Name gestor-pecas } `
            -StartService { Start-Service -Name gestor-pecas }
