name: Deploy

# Dispara só por tag de release (ex.: `git tag v1.2.0 && git push --tags`),
# nunca em push comum na master — decisão do usuário, para não implantar em
# produção algo que ainda está em teste.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Gate real: chama o CI (backend + frontend + security) como workflow
  # reutilizável para o MESMO commit da tag, uma única vez (ci.yml ignora
  # pushes de tag no próprio trigger `push`, então não roda em duplicidade).
  # Nenhum job de deploy abaixo inicia sem isto ter passado.
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-frontend:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist

  deploy:
    needs: [validate, build-frontend]
    # Roda no runner self-hosted instalado NA PRÓPRIA VM (Windows Server
    # 2025 — decisão da infra, 21/09/2026): ela fica atrás de firewall, sem
    # IP público, só com RDP/administração interna (ver requisitos de
    # infraestrutura). Um runner self-hosted puxa o job de dentro para
    # fora, sem precisar abrir porta de entrada nenhuma.
    #
    # Pré-requisito (ainda pendente — VM não provisionada): instalar o
    # runner do GitHub Actions para Windows na VM com a label
    # "gestor-pecas-vm" (Settings > Actions > Runners > New self-hosted
    # runner no repositório, escolhendo Windows).
    runs-on: [self-hosted, Windows, gestor-pecas-vm]
    env:
      APP_DIR: C:\gestor-pecas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      # Sincroniza o código para o diretório de execução, preservando o
      # .venv e o .env existentes (nunca sobrescritos pelo deploy).
      # Códigos de saída do robocopy 0–7 são sucesso (arquivos copiados/
      # já iguais); só >=8 é falha real.
      - name: Sincronizar código para ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          robocopy . "${env:APP_DIR}" /MIR /XD .venv .git node_modules "web\node_modules"
          if ($LASTEXITCODE -ge 8) { exit 1 }

      - name: Instalar dependências Python
        shell: pwsh
        run: |
          & "${env:APP_DIR}\.venv\Scripts\pip.exe" install -r "${env:APP_DIR}\requirements.txt"

      # Migrations aplicam automaticamente na inicialização do processo
      # (auto_migrate em app/database/database.py) — não há passo manual
      # aqui, só reiniciar o serviço. O serviço "gestor-pecas" é registrado
      # via NSSM (nssm.cc), que expõe o processo uvicorn como um Serviço do
      # Windows comum — por isso basta Restart-Service.
      - name: Reiniciar o serviço
        shell: pwsh
        run: Restart-Service -Name gestor-pecas

      - name: Validar saúde após o restart
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          $resposta = Invoke-WebRequest -Uri http://127.0.0.1:8000/api/v1/system/health -UseBasicParsing
          if ($resposta.StatusCode -ne 200) { exit 1 }
