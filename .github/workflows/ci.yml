name: CI

# Roda em push normal (branches) e PR. Tags v* são excluídas daqui de
# propósito: deploy.yml chama este workflow via workflow_call para tags,
# então rodar de novo pelo trigger `push` duplicaria a validação no mesmo
# ref (mesmo commit sendo validado duas vezes em paralelo).
on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestor_pecas_test
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor -d gestor_pecas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://gestor:gestor@localhost:5432/gestor_pecas_test
      # O runner do GitHub Actions usa UTC como fuso do sistema; a aplicação
      # fixa a sessão PostgreSQL em America/Sao_Paulo (ver connection.py).
      # Sem isto, datetime.now() do Python (UTC) e LOCALTIMESTAMP do Postgres
      # (America/Sao_Paulo) ficam 3h divergentes.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - name: npm audit (dependências com CVE conhecida, alta/crítica)
        # Roda sempre, mesmo se um passo anterior falhar, para o sinal de
        # segurança não ficar escondido atrás de uma falha de build/teste.
        if: always()
        run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scanning, inclui histórico de commits)
        # Pin por digest (reproduzível) — o gitleaks não é rastreado pelo
        # Dependabot (ecossistema docker do Dependabot só cobre Dockerfile/
        # compose, não `docker run` inline em workflow); atualizar a versão
        # e o digest manualmente de tempos em tempos.
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --config=/repo/.gitleaks.toml -v --redact
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pip-audit (dependências com CVE conhecida)
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: bandit (padrões inseguros no código Python)
        # Bloqueante: os 44 achados da auditoria de 20/09/2026 foram todos
        # triados (ver docs/CLAUDE_CODE_SETUP.md) — reais corrigidos, falsos
        # positivos suprimidos localmente com #nosec + comentário. Qualquer
        # achado NOVO passa a falhar o build de propósito.
        run: bandit -r backend mes app -ll
