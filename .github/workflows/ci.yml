name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestor_pecas_test
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor -d gestor_pecas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://gestor:gestor@localhost:5432/gestor_pecas_test
      # O runner do GitHub Actions usa UTC como fuso do sistema; a aplicação
      # fixa a sessão PostgreSQL em America/Sao_Paulo (ver connection.py).
      # Sem isto, datetime.now() do Python (UTC) e LOCALTIMESTAMP do Postgres
      # (America/Sao_Paulo) ficam 3h divergentes.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scanning, inclui histórico de commits)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --config=/repo/.gitleaks.toml -v --redact
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: pip-audit (dependências com CVE conhecida)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: bandit (padrões inseguros no código Python)
        # Informativo por ora: primeira rodada encontrou ~44 avisos, quase todos
        # B608 (f-string em SQL) sobre listas de colunas constantes, não input
        # de usuário — falso positivo provável. Não falha o build ainda; depois
        # de triagem (marcar os reais com #nosec ou corrigir), trocar para gate.
        run: |
          pip install bandit
          bandit -r backend mes app -ll || true
