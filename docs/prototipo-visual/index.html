<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de Peças — Conceito Visual</title>
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#EEF2F8; --line:#E1E7F0; --ink:#0B1B3A; --muted:#64748F;
  --primary:#0866F5; --primary-soft:#E6F0FF; --navy:#071A3A; --navy2:#0D2850;
  --ok:#16A34A; --ok-soft:#E5F6EC; --warn:#F59E0B; --warn-soft:#FEF3DC; --bad:#E5484D; --bad-soft:#FCE9EA;
  --rework:#C2570C; --rework-soft:#FDEBDD; --idle:#8A97B1;
  --shadow:0 1px 2px rgba(11,27,58,.05),0 8px 24px -12px rgba(11,27,58,.14);
  --r:18px; --font:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0A1220; --surface:#111C30; --surface2:#17253D; --line:#22324F; --ink:#E8EEF9; --muted:#8FA0BF;
  --primary:#4C9BFF; --primary-soft:#14305C; --navy:#060D1A; --navy2:#0C1A31;
  --ok:#3DD17A; --ok-soft:#10301F; --warn:#F7B538; --warn-soft:#37290C; --bad:#FF6B70; --bad-soft:#3A1519;
  --rework:#FF9650; --rework-soft:#3A2010; --idle:#6D7C99;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}
[data-theme="warm"]{
  --bg:#F4EFE6; --surface:#FBF8F2; --surface2:#EFE8DB; --line:#E3DACA; --ink:#2A2A33; --muted:#76706A;
  --primary:#2F6FD6; --primary-soft:#E3ECFA; --navy:#2B3345; --navy2:#38425A;
  --ok:#3E8F5A; --ok-soft:#E2F0E6; --warn:#D99422; --warn-soft:#F8EAC9; --bad:#C9524F; --bad-soft:#F6DEDB;
  --rework:#B4601F; --rework-soft:#F5E1CD; --idle:#9A9488;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 24px -12px rgba(60,45,20,.16);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.ic{flex:none}
.num,.timer,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell gestão ---------- */
.shell{display:grid;grid-template-columns:var(--sw,252px) 1fr;min-height:100vh;transition:grid-template-columns .3s}
.shell.mini{--sw:76px}
.side{position:sticky;top:0;height:100vh;background:var(--navy);color:#DCE6F7;display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px;font-weight:700;letter-spacing:.2px}
.brand i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2C86FF,#0750C8);display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.brand span{white-space:nowrap;overflow:hidden}
.mini .brand span,.mini .nv span,.mini .side-foot span{display:none}
.nv{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:13px;color:#B7C6E2;transition:background .2s,color .2s,transform .2s;white-space:nowrap}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.nv.on{background:linear-gradient(90deg,rgba(8,102,245,.9),rgba(8,102,245,.55));color:#fff}
.nv .ic{opacity:.95}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:14px}
.crumb b{color:var(--ink);font-weight:600}
.sp{flex:1}
.cmdk{display:flex;align-items:center;gap:10px;min-width:300px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:border-color .2s,box-shadow .2s}
.cmdk:hover{border-color:var(--primary);outline:3px solid var(--primary-soft)}
kbd{font:600 11px var(--font);padding:2px 7px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ok);opacity:.35}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.ib{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;transition:transform .15s,border-color .2s}
.ib:hover{transform:translateY(-1px);border-color:var(--primary)}
.ib .badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.who{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.who i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2C86FF,#7A5CFF);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:13px}
.who select{background:none;border:0;font-weight:600;outline:0;cursor:pointer}
.page{padding:26px 28px 60px;max-width:1500px;width:100%;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ph h1{font-size:28px;letter-spacing:-.4px}
.ph p{color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px}
.tab{padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;transition:all .2s}
.tab:hover{color:var(--ink);border-color:var(--primary)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 22px}
.seg{display:inline-flex;padding:4px;background:var(--surface2);border-radius:13px;gap:2px}
.seg button{padding:7px 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sel{padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.card.hv:hover{transform:translateY(-3px)}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:18px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:18px}
@media(max-width:1180px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12,.g3{grid-template-columns:1fr}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.g5,.g4,.g2{grid-template-columns:1fr}.cmdk{min-width:0}.page{padding:18px 16px 50px}.top{padding:12px 16px}.live{display:none}}
.kpi{position:relative;overflow:hidden}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font-size:34px;font-weight:700;letter-spacing:-1px;margin:6px 0 2px;display:flex;align-items:baseline;gap:4px}
.kpi .v u{text-decoration:none;font-size:16px;color:var(--muted);font-weight:600}
.kpi .d{font-size:12.5px;font-weight:700;display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:999px}
.up{color:var(--ok);background:var(--ok-soft)}.dn{color:var(--bad);background:var(--bad-soft)}
.kpi svg.sp1{position:absolute;right:0;bottom:0;width:62%;height:54px;opacity:.9}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}.p-warn{color:#B77700;background:var(--warn-soft)}[data-theme=dark] .p-warn{color:var(--warn)}.p-info{color:var(--primary);background:var(--primary-soft)}.p-idle{color:var(--muted);background:var(--surface2)}.p-rw{color:var(--rework);background:var(--rework-soft)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:0 12px 10px}
td{padding:13px 12px;border-top:1px solid var(--line);font-size:14px}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--surface2)}
.tw{overflow:auto}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--primary));width:var(--w);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.row{display:flex;align-items:center;gap:12px}
.lrow{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;padding:8px 0;font-size:14px}
.lrow b{text-align:right}
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;width:var(--w);background:var(--c);transform-origin:left;animation:grow 1s both}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;margin-top:16px;font-size:13.5px}
.legend span{display:flex;align-items:center;gap:8px;color:var(--muted)}.legend b{margin-left:auto;color:var(--ink)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.feed{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px;max-height:430px;overflow:auto}
.feed li{display:flex;gap:12px;padding:11px 8px;border-radius:12px;animation:slide .5s both;font-size:14px}
.feed li:hover{background:var(--surface2)}
@keyframes slide{from{opacity:0;transform:translateX(-12px);background:var(--primary-soft)}}
.feed .t{color:var(--muted);font-size:12.5px;white-space:nowrap;margin-left:auto}
.feed .ev{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.attn{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;transition:background .2s}
.attn:hover{background:var(--surface2)}
.attn .tm{margin-left:auto;font-weight:700;color:var(--bad)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.chart .ar{opacity:.14;animation:fade 1.6s both}@keyframes fade{from{opacity:0}}
.chart text{fill:var(--muted);font-size:11.5px}
.chart .gl{stroke:var(--line);stroke-dasharray:3 5}
.heat{display:grid;gap:4px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--primary);opacity:var(--o);transition:transform .2s}.heat i:hover{transform:scale(1.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:13px;font-weight:700;background:var(--primary);color:#fff;transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 6px 16px -10px rgba(15,23,42,.45)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
/* IA */
.ia{display:flex;flex-direction:column;gap:14px;min-height:340px}
.msg{max-width:78%;padding:13px 16px;border-radius:16px;animation:rise .4s both}
.msg.u{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.msg.a{background:var(--surface2);border-bottom-left-radius:5px}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;animation:bounce 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-5px);opacity:.4}}
/* paleta */
.ovl{position:fixed;inset:0;background:rgba(5,12,28,.55);backdrop-filter:blur(6px);z-index:90;display:grid;place-items:start center;padding-top:12vh;animation:fade2 .2s both}
@keyframes fade2{from{opacity:0}}
.pal{width:min(640px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;animation:rise .25s both}
.pal input{width:100%;padding:20px 22px;border:0;border-bottom:1px solid var(--line);background:none;font-size:17px;outline:0}
.pal ul{list-style:none;padding:8px;max-height:52vh;overflow:auto}
.pal li{display:flex;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;align-items:center}
.pal li small{color:var(--muted);margin-left:auto}
.pal li.on,.pal li:hover{background:var(--primary-soft)}
.toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:120}
.toast{background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);animation:rise .3s both;font-weight:600;max-width:420px}
/* Andon & mapa */
.tv{background:#050B16;color:#EAF1FF;border-radius:var(--r);padding:22px;border:1px solid #16243C}
.tv h2{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#7F93B8;margin-bottom:16px;display:flex;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{border-radius:16px;padding:16px;background:#0C1A31;border:1px solid #17294A;position:relative;overflow:hidden;transition:transform .3s,opacity .4s}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--sc)}
.tile.pulse{animation:glow 1.6s infinite}
@keyframes glow{50%{border-color:var(--sc)}}
.tile b{font-size:18px;display:block}.tile small{color:#8CA0C4}
.tile .tm{font-size:26px;font-weight:700;margin-top:8px;color:var(--sc)}
.tile.dim{opacity:.35}
.map{width:100%;height:auto;background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.map .blk{cursor:pointer;transition:filter .2s,transform .2s;transform-box:fill-box;transform-origin:center}
.map .blk:hover{filter:brightness(1.1);transform:scale(1.02)}
.map text{font-family:var(--font);pointer-events:none}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;pointer-events:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
/* landing */
.land{max-width:1180px;margin:0 auto;padding:54px 24px 80px}
.hero h1{font-size:clamp(34px,5vw,56px);letter-spacing:-1.6px;line-height:1.05;margin:12px 0 14px}
.hero p{color:var(--muted);font-size:18px;max-width:640px}
.tag{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:36px 0}
@media(max-width:760px){.doors{grid-template-columns:1fr}}
.door{border-radius:26px;padding:30px;min-height:230px;display:flex;flex-direction:column;gap:10px;color:#fff;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.door:hover{transform:translateY(-5px) rotate(-.3deg);box-shadow:0 30px 60px -28px rgba(15,23,42,.5)}
.door.g{background:linear-gradient(135deg,#0A2A5C,#0866F5)}.door.o{background:linear-gradient(135deg,#0B3D2A,#16A34A)}
.door h2{font-size:28px;letter-spacing:-.6px}.door p{opacity:.85;max-width:380px}
.door .go{margin-top:auto;font-weight:700;display:flex;gap:8px;align-items:center}
.door::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.rmap{columns:3 280px;column-gap:18px}
.rmap .card{break-inside:avoid;margin-bottom:18px;padding:18px}
.rmap a{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;font-size:14px}
.rmap a:hover{background:var(--primary-soft);color:var(--primary)}
.rmap a small{color:var(--muted);font-size:12px}
.rmap h4{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.note{margin-top:30px;padding:16px 20px;border-radius:16px;background:var(--warn-soft);color:var(--ink);font-size:14px}

/* ---------- operador ---------- */
.op{min-height:100vh;display:flex;flex-direction:column}
.optop{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--navy);color:#E6EEFB}
.optop .res{font-size:20px;font-weight:700}.optop small{color:#8EA3C8;display:block;font-size:12.5px}
.optop .clock{font-size:24px;font-weight:700;letter-spacing:.5px}
.optop .seg{background:rgba(255,255,255,.08)}.optop .seg button{color:#A9BAD9}.optop .seg button.on{background:#fff;color:#0B1B3A}
.optop .ib{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.opbody{padding:24px 26px 120px;max-width:1500px;width:100%;margin:0 auto;animation:rise .4s both}
.pick h2{font-size:30px;letter-spacing:-.6px}.pick p{color:var(--muted);margin:4px 0 24px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.rcard{text-align:left;padding:24px;border-radius:24px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:170px;transition:transform .2s,border-color .2s}
.rcard:hover{transform:translateY(-4px);border-color:var(--primary)}
.rcard .ico{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.rcard strong{font-size:22px}
.rcard.em-uso{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}.rcard.em-uso .ico{background:var(--warn-soft);color:var(--warn)}
.rcard.ocupada{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}.rcard.ocupada .ico{background:var(--bad-soft);color:var(--bad)}
.wb{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:20px}
@media(max-width:1000px){.wb{grid-template-columns:1fr}}
.hero-st{border-radius:28px;padding:26px 30px;color:#fff;display:flex;align-items:center;gap:26px;background:linear-gradient(120deg,var(--sc),color-mix(in srgb,var(--sc) 70%,#000));box-shadow:0 22px 50px -24px rgba(15,23,42,.5);transition:background .5s;position:relative;overflow:hidden}
.hero-st::after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-st .st{font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:700;opacity:.9;display:flex;align-items:center;gap:10px}
.hero-st .big{font-size:60px;font-weight:700;letter-spacing:-2px;line-height:1.05}
.hero-st .sub{opacity:.9;font-size:15.5px}
.ring{width:128px;height:128px;flex:none;position:relative;z-index:1}
.ring text{fill:#fff;font-weight:700}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:rgba(255,255,255,.25)}.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .8s}
.opc{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;gap:10px;flex:1;min-width:260px}
.field input{flex:1;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:19px;font-weight:600;letter-spacing:.5px;outline:0;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--primary);outline:4px solid var(--primary-soft)}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
@media(max-width:760px){.acts{grid-template-columns:repeat(2,1fr)}}
.act{min-height:104px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;color:#fff;background:var(--ac);box-shadow:0 14px 26px -14px rgba(15,23,42,.5);transition:transform .15s,filter .2s,opacity .3s}
.act:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.08)}.act:active:not(:disabled){transform:scale(.96)}
.act:disabled{opacity:.28;box-shadow:none;cursor:not-allowed;filter:grayscale(.5)}
.act.rec{animation:pulse 1.4s infinite}
@keyframes pulse{50%{outline:7px solid color-mix(in srgb,var(--ac) 28%,transparent)}}
.opcard{margin-top:20px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kv div{background:var(--surface2);padding:12px 14px;border-radius:14px}.kv small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}.kv b{font-size:17px}
.steps{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--surface2);color:var(--muted)}
.step.done{background:var(--ok-soft);color:var(--ok)}.step.cur{background:var(--primary);color:#fff;box-shadow:0 6px 14px -8px rgba(15,23,42,.45)}
.q{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;transition:all .2s;width:100%}
.qi:hover{border-color:var(--primary);transform:translateX(3px)}
.qi.on{border-color:var(--primary);background:var(--primary-soft)}
.qi .pos{width:34px;height:34px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex:none}
.qi small{color:var(--muted);display:block}
.tl{list-style:none;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 16px 36px;animation:slide .5s both}
.tl li::before{content:"";position:absolute;left:4px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid var(--surface)}
.tl small{color:var(--muted)}
.fab{position:fixed;right:26px;bottom:26px;display:flex;align-items:center;gap:10px;padding:16px 24px;border-radius:999px;background:var(--bad);color:#fff;font-weight:700;font-size:16px;box-shadow:0 14px 30px -14px rgba(15,23,42,.55);z-index:40;transition:transform .2s}
.fab:hover{transform:scale(1.05)}
.mdl{background:var(--surface);border-radius:28px;width:min(680px,94vw);padding:28px;box-shadow:0 40px 90px -24px rgba(0,0,0,.6);animation:rise .3s both;max-height:88vh;overflow:auto}
.mdl h2{font-size:24px;letter-spacing:-.4px}.mdl>p{color:var(--muted);margin:4px 0 20px}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.reason{padding:18px 14px;border-radius:18px;border:2px solid var(--line);font-weight:700;text-align:center;transition:all .2s;display:flex;flex-direction:column;gap:8px;align-items:center}
.reason:hover{border-color:var(--bad);background:var(--bad-soft);transform:translateY(-2px)}
.reason.c:hover{border-color:var(--primary);background:var(--primary-soft)}
.stp{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;border-radius:20px;background:var(--surface2);margin-bottom:14px}
.stp label{font-weight:700;font-size:17px}.stp small{display:block;color:var(--muted);font-weight:500}
.stp .ctl{display:flex;align-items:center;gap:12px}
.stp .ctl button.r{width:60px;height:60px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-size:28px;font-weight:700;transition:all .15s}
.stp .ctl button.r:hover{border-color:var(--primary);color:var(--primary)}.stp .ctl button.r:active{transform:scale(.92)}
.stp .ctl output{font-size:42px;font-weight:700;min-width:84px;text-align:center}
.quick{display:flex;gap:8px;margin-top:8px}
.mrow{display:grid;grid-template-columns:1fr 100px 130px 44px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mrow input{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:700;width:100%;outline:0;text-align:right}
.mrow input:focus{border-color:var(--primary)}
.mrow.ok input{border-color:var(--ok)}.mrow.bad input{border-color:var(--bad);background:var(--bad-soft)}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.warnbox{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.gate{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gate button{padding:24px 18px;border-radius:22px;border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;transition:all .2s}
.gate button:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-3px)}
.gate strong{font-size:19px}.gate span{color:var(--muted);font-size:14px}

/* ===================== componentes de gráfico ===================== */
function spark(v,color){const w=200,h=54,mx=Math.max(...v),mn=Math.min(...v),sx=w/(v.length-1);const pts=v.map((x,i)=>[i*sx,h-6-(x-mn)/(mx-mn||1)*(h-14)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');return `<svg class="sp1" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}L${w} ${h}L0 ${h}Z" fill="${color}" opacity=".13"/><path d="${d}" pathLength="1" class="ln" style="stroke-width:2.4;fill:none;stroke:${color};stroke-linecap:round;stroke-linejoin:round"/></svg>`}
function line(series,labels,h=230){const w=720,pl=36,pb=26,pt=10;const all=series.flatMap(s=>s.v),mx=Math.max(...all)*1.08,mn=Math.min(0,...all);const n=series[0].v.length,sx=(w-pl)/(n-1),sy=v=>pt+(h-pt-pb)*(1-(v-mn)/(mx-mn||1));let g='';for(let i=0;i<=4;i++){const y=pt+(h-pt-pb)*i/4;g+=`<line class="gl" x1="${pl}" x2="${w}" y1="${y}" y2="${y}"/><text x="0" y="${y+4}">${Math.round(mx-(mx-mn)*i/4)}</text>`}
 labels.forEach((l,i)=>{if(i%Math.ceil(n/8)===0)g+=`<text x="${pl+i*sx}" y="${h-4}" text-anchor="middle">${l}</text>`});
 series.forEach(s=>{const p=s.v.map((x,i)=>[pl+i*sx,sy(x)]);const d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  g+=`<path class="ar" d="${d}L${w} ${h-pb}L${pl} ${h-pb}Z" fill="${s.c}"/><path class="ln" pathLength="1" d="${d}" stroke="${s.c}" ${s.dash?'style="stroke-dasharray:6 7;animation:none"':''}/>`;
  p.forEach((q,i)=>{if(i%2===0)g+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.6" fill="var(--surface)" stroke="${s.c}" stroke-width="2.2"><title>${s.n}: ${s.v[i]}</title></circle>`})});
 return `<svg class="chart" viewBox="0 0 ${w} ${h}">${g}</svg>`}
function donut(parts,center){const r=52,c=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p.v,0);let off=0;const seg=parts.map(p=>{const l=p.v/tot*c;const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${p.n}: ${fmt(p.v,1)}</title></circle>`;off+=l;return s}).join('');

function gauge(v,label){const r=70,c=Math.PI*r;const col=v>=75?'var(--ok)':v>=55?'var(--warn)':'var(--bad)';return `<svg viewBox="0 0 180 112" style="width:100%;max-width:260px;display:block;margin:auto"><path d="M20 98 A70 70 0 0 1 160 98" fill="none" stroke="var(--surface2)" stroke-width="16" stroke-linecap="round"/><path d="M20 98 A70 70 0 0 1 160 98" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/><text x="90" y="86" text-anchor="middle" style="fill:var(--ink);font-size:30px;font-weight:700">${fmt(v,1)}%</text><text x="90" y="104" text-anchor="middle" style="fill:var(--muted);font-size:11px">${label}</text></svg>`}
function hbars(items,unit=''){const mx=Math.max(...items.map(i=>i.v));return items.map(i=>`<div class="lrow"><span>${i.l}</span><div class="bar"><i style="--w:${i.v/mx*100}%;--c:${i.c||'var(--primary)'}"></i></div><b class="tnum">${fmt(i.v,i.d??0)}${unit}</b></div>`).join('')}

function kpi(k,i,r){const v=k.min+r()*(k.max-k.min),d=(r()*8-3).toFixed(1),up=d>=0;const c=['var(--primary)','var(--ok)','var(--warn)','#7A5CFF','var(--bad)'][i%5];

function firstPiece(){const C=O.sector==='Pintura'?[['Espessura da camada (µm)',80,20],['Aderência (classe 0–1)',0,1],['Brilho (GU)',85,10]]:[['Diâmetro do furo A (mm)',25,.1],['Altura total (mm)',120,.5],['Ângulo (°)',90,.5]];
 modal(`<h2>Primeira peça</h2><p>Meça e digite. Verde = dentro da tolerância.</p>${C.map((c,i)=>`<div class="mrow" data-n="${c[1]}" data-t="${c[2]}"><div><b>${c[0]}</b><br><small style="color:var(--muted)">nominal ${c[1]} ± ${c[2]}</small></div><input inputmode="decimal" placeholder="—" data-i="${i}"><span class="mres" style="font-weight:700"></span><span></span></div>`).join('')}<div id="fpw"></div><div class="mact"><button class="btn sec" id="fp-fill">Preencher exemplo</button><button class="btn sec" id="fp-bad">Simular fora de cota</button><button class="btn" id="fp-ok" disabled>Aprovar e produzir</button></div>`,()=>{
  const chk=()=>{let all=true,bad=false;$$('.mrow').forEach(row=>{const v=parseFloat($('input',row).value.replace(',','.')),n=+row.dataset.n,t=+row.dataset.t;row.className='mrow';if(isNaN(v)){all=false;$('.mres',row).textContent='';return}const ok=Math.abs(v-n)<=t+1e-9;row.classList.add(ok?'ok':'bad');$('.mres',row).textContent=ok?'✔ ok':'✖ fora';$('.mres',row).style.color=ok?'var(--ok)':'var(--bad)';if(!ok)bad=true});
   const w=$('#fpw'),b=$('#fp-ok');if(bad){w.innerHTML=`<div class="warnbox">Cota fora da tolerância. Para seguir, um responsável precisa autorizar exceção.<div class="field" style="margin-top:10px"><input id="badge" placeholder="Bipe o crachá do responsável (ex.: 0907)" style="padding:12px"><button class="btn sm" id="auth">Autorizar</button></div></div>`;b.disabled=true;$('#auth').onclick=()=>{if($('#badge').value.trim()==='0907'){w.innerHTML='<div class="warnbox" style="background:var(--ok-soft);color:var(--ok)">Exceção autorizada por Sandro Alves (Qualidade).</div>';b.disabled=false}else toast('Crachá inválido — use 0907 na demonstração')}}else{w.innerHTML='';b.disabled=!all}};
  $$('.mrow input').forEach(i=>i.oninput=chk);$('#fp-fill').onclick=()=>{$$('.mrow').forEach(r=>$('input',r).value=r.dataset.n);chk()};$('#fp-bad').onclick=()=>{$$('.mrow').forEach((r,i)=>$('input',r).value=i===0?(+r.dataset.n+ +r.dataset.t*3).toFixed(2):r.dataset.n);chk()};
  $('#fp-ok').onclick=()=>{closeModal();setStatus('produzindo');toast('Primeira peça aprovada · produção iniciada')}})}

function finish(){const D=OPDATA[O.sector],it=O.item,sug=O.status==='produzindo'?Math.min(it.n,Math.floor((Date.now()-O.startedAt)/1000/D.std)):0;let b=sug||it.n,rf=0;
 modal(`<h2>${O.status==='setup'?'Finalizar setup':'Finalizar produção'}</h2><p>${O.status==='setup'?'Setup concluído — o recurso fica livre para iniciar.':'Confirme as quantidades. Sugestão baseada no tempo padrão.'}</p>${O.status==='setup'?'':`<div class="stp"><div><label>Boas</label><small>de ${it.n} planejadas</small><div class="quick">${[1,5,10].map(n=>`<button class="chip" data-b="${n}">+${n}</button>`).join('')}<button class="chip" data-b="all">Todas</button></div></div><div class="ctl"><button class="r" data-d="b-">−</button><output id="ob">${b}</output><button class="r" data-d="b+">+</button></div></div><div class="stp"><div><label>Refugo</label><small>peças descartadas</small></div><div class="ctl"><button class="r" data-d="r-">−</button><output id="orf">0</output><button class="r" data-d="r+">+</button></div></div>`}<div class="mact"><button class="btn sec" id="fin-c">Cancelar</button><button class="btn" id="fin-ok">Confirmar</button></div>`,()=>{
  const up=()=>{$('#ob')&&($('#ob').textContent=b);$('#orf')&&($('#orf').textContent=rf)};
  $$('[data-d]').forEach(x=>x.onclick=()=>{const d=x.dataset.d;if(d==='b+')b++;if(d==='b-')b=Math.max(0,b-1);if(d==='r+')rf++;if(d==='r-')rf=Math.max(0,rf-1);up()});
  $$('[data-b]').forEach(x=>x.onclick=()=>{b=x.dataset.b==='all'?it.n:b+ +x.dataset.b;up()});$('#fin-c').onclick=closeModal;
  $('#fin-ok').onclick=()=>{closeModal();if(O.status==='setup'){setStatus('livre');return toast('Setup finalizado')}O.boas+=b;O.refugo+=rf;const cur=it.ops.find(o=>o[2]==='cur');cur[2]='done';const nx=it.ops.find(o=>o[2]==='todo');if(nx)nx[2]='cur';O._est=0;setStatus('livre');toast(`${b} boas · ${rf} refugo registrados. ${nx?'Próxima: '+nx[1]:'Roteiro concluído'}`)}})}

function callSheet(){const C=[['Manutenção','gear'],['Qualidade','qual'],['Líder','user'],['Material','box']];modal(`<h2>Chamar ajuda</h2><p>A gestão e o Telegram recebem na hora, com o seu posto.</p><div class="reasons">${C.map(c=>`<button class="reason c" data-c="${c[0]}"><span style="color:var(--primary)">${ic(c[1],30)}</span>${c[0]}</button>`).join('')}</div>`,()=>$$('.reason').forEach(b=>b.onclick=()=>{closeModal();toast(`Chamado de ${b.dataset.c} enviado · ${O.resource}`)}))}

/* ===================== modal/toast/paleta ===================== */
function modal(html,bind){closeModal();const o=document.createElement('div');o.className='ovl';o.id='modal';o.style.placeItems='center';o.style.paddingTop='0';o.innerHTML=`<div class="mdl">${html}</div>`;o.onclick=e=>{if(e.target===o)closeModal()};document.body.appendChild(o);bind&&bind()}
function closeModal(){$('#modal')?.remove()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>{d.style.transition='all .4s';d.style.opacity=0;d.style.transform='translateY(8px)';setTimeout(()=>d.remove(),400)},3200)}
function palette(){closeModal();const o=document.createElement('div');o.className='ovl';o.id='modal';o.innerHTML=`<div class="pal"><input id="pin" placeholder="Digite o nome de uma tela…" autocomplete="off"><ul id="pl"></ul></div>`;o.onclick=e=>{if(e.target===o)closeModal()};document.body.appendChild(o);
 const all=[...ALLTABS.filter(t=>visible(t.sec)).map(t=>({l:t.label,s:t.sec.label,h:'#'+t.path})),{l:'Apontamento — seleção de recurso',s:'Operador',h:'#/operador'},{l:'Mapa de rotas (início)',s:'Conceito',h:'#/'}];let sel=0,cur=all;
 const draw=()=>{$('#pl').innerHTML=cur.slice(0,9).map((x,i)=>`<li class="${i===sel?'on':''}" data-h="${x.h}">${ic('chev',16)}<b>${x.l}</b><small>${x.s}</small></li>`).join('')||'<li>Nada encontrado</li>';$$('#pl li').forEach(li=>li.onclick=()=>{closeModal();location.hash=li.dataset.h})};
 const inp=$('#pin');inp.focus();draw();inp.oninput=()=>{const q=inp.value.toLowerCase();cur=all.filter(x=>(x.l+' '+x.s).toLowerCase().includes(q));sel=0;draw()};
 inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,Math.min(cur.length,9)-1);draw();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault()}if(e.key==='Enter'&&cur[sel]){closeModal();location.hash=cur[sel].h}}}

/* ===================== roteador ===================== */
function route(){closeModal();let p=location.hash.slice(1)||'/';const app=$('#app');document.documentElement.dataset.theme=S.theme;
 if(p==='/'){app.innerHTML=landing();scrollTo(0,0);return after()}
 if(p.startsWith('/operador')){if(p==='/operador/posto'&&!O.resource)O.resource=OPDATA[O.sector].res[0][0];app.innerHTML=operator();bindShell();if(O.resource)opRender();$$('[data-res]').forEach(b=>b.onclick=()=>{O.resource=b.dataset.res;O.item=null;O.status='livre';O.since=Date.now();route()});$$('#sect button').forEach(b=>b.onclick=()=>{O.sector=b.dataset.s;O.resource=null;O.item=null;O.status='livre';O.hist=[];route()});return}
 const tab=ALLTABS.find(t=>p===t.path||p.startsWith(t.path+'/'))||ALLTABS[0];
 if(!visible(tab.sec)){S.role='admin'}
 app.innerHTML=mgmt(tab);bindShell();bindMgmt(tab);after()}
function bindShell(){$('#theme')?.addEventListener('click',()=>{S.theme={light:'dark',dark:'warm',warm:'light'}[S.theme];store.set('theme',S.theme);const hs=location.hash;document.documentElement.dataset.theme=S.theme;const b=$('#theme');if(b)b.innerHTML=ic(S.theme==='dark'?'moon':S.theme==='warm'?'leaf':'sun');toast('Tema: '+{light:'Claro',dark:'Escuro',warm:'Conforto (tom quente, menos azul)'}[S.theme])});tick()}
function bindMgmt(tab){$('#cmdk')?.addEventListener('click',palette);$('#mini')?.addEventListener('click',()=>{S.mini=!S.mini;$('.shell').classList.toggle('mini',S.mini)});
 $('#role')?.addEventListener('change',e=>{S.role=e.target.value;const t=ALLTABS.find(x=>x.id===tab.id);if(!visible(t.sec)){toast('Nível '+S.role+' não vê “'+t.sec.label+'” — voltando ao início');location.hash='#/inicio/visao-geral'}else route()});
 $$('[data-period]').forEach(b=>b.onclick=()=>{S.period=b.dataset.period;route()});$('#fsec')?.addEventListener('change',e=>{S.sector=e.target.value;route()});$('#fclear')?.addEventListener('click',()=>{S.period='Hoje';S.sector='Todos';route()});
 if(tab.id==='home-alerts'){$$('#aseg button').forEach(b=>b.onclick=()=>{$$('#aseg button').forEach(x=>x.classList.toggle('on',x===b));$$('#alist>.card').forEach(c=>c.style.display=b.dataset.a==='*'||c.dataset.sev===b.dataset.a?'':'none')});$$('[data-ack]').forEach(b=>b.onclick=()=>{const c=b.closest('.card');c.style.transition='all .4s';c.style.opacity=0;c.style.transform='scale(.96)';setTimeout(()=>c.remove(),400);toast('Alerta reconhecido')})}
 if(tab.id==='home-ai'){const box=$('#ia');$$('[data-q]').forEach((b,i)=>b.onclick=()=>{box.insertAdjacentHTML('beforeend',`<div class="msg u">${b.dataset.q}</div>`);const t=document.createElement('div');t.className='msg a typing';t.innerHTML='<i></i><i></i><i></i>';box.appendChild(t);setTimeout(()=>{t.className='msg a';t.innerHTML=AI_ANS[i]},1100)})}
 if(tab.id==='panels-andon'){let i=0;const rot=['Todos',...SECTORS];clearInterval(window._rot);window._rot=setInterval(()=>{if(!$('#tiles'))return clearInterval(window._rot);i=(i+1)%rot.length;$('#rot').textContent=rot[i]==='Todos'?'Todos os setores':'Destaque: '+rot[i];$$('.tile').forEach(t=>t.classList.toggle('dim',rot[i]!=='Todos'&&t.dataset.sec!==rot[i]))},3500)}
 if(tab.id==='panels-factory-map'){const tip=document.createElement('div');tip.className='tip';tip.style.display='none';document.body.appendChild(tip);$$('.blk').forEach(g=>{g.onmousemove=e=>{tip.style.display='block';tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px';const c=g.dataset.c;tip.innerHTML=`<b>${g.dataset.n}</b><br>${c?RES[c].length+' recursos · OEE '+fmt(40+(hash(c)%30),1)+'%':'Sem apontamento'}`};g.onmouseleave=()=>tip.style.display='none'})}}

/* ===================== vida: animações e relógio ===================== */
function after(){$$('.num').forEach(el=>{const to=+el.dataset.to,d=+el.dataset.dec,suf=el.dataset.suf||'',t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e,d)+suf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});tickTimers()}
function tickTimers(){$$('.timer').forEach(el=>el.textContent=hms((Date.now()-(+el.dataset.since))/1000))}
function tick(){const d=new Date();$$('.clock').forEach(c=>c.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`)}
const LIVE_E=[['produzindo','check','finalizou 12 peças','Pintura 2'],['parada','pause','parou: aguardando ponte rolante','DOBRA1'],['setup','tool','terminou setup','CENTRO2'],['produzindo','play','iniciou OP 00593004002','Estação 1'],['retrabalho','redo','abriu retrabalho (2 peças)','SERRA1'],['parada','phone','chamou Qualidade','Estação 3']];
setInterval(()=>{S.tick++;tick();tickTimers();
 if(location.hash.includes('/operador')&&O.item&&O.status==='produzindo'){const D=OPDATA[O.sector],est=Math.min(O.item.n,Math.floor((Date.now()-O.startedAt)/1000/D.std));O._est=est;$('#estn')&&($('#estn').textContent=est);$('#ringfg')&&$('#ringfg').setAttribute('stroke-dashoffset',345.6*(1-est/O.item.n))}
 const f=$('#feed');if(f&&S.tick%4===0){const e=LIVE_E[Math.floor(Math.random()*LIVE_E.length)];f.insertAdjacentHTML('afterbegin',feedLi(e,0,true));while(f.children.length>8)f.lastChild.remove()}},1000);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!location.hash.includes('operador')){e.preventDefault();palette()}if(e.key==='Escape')closeModal()});
addEventListener('hashchange',route);route();
</script>
