<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apontamento — maquetes</title>
<style>
:root{
  --bg:#0a1322;--surface:#111e32;--surface-alt:#0e1a2c;--surface-hi:#162740;
  --border:#243650;--border-strong:#34507a;--divider:#1b2b42;
  --text:#e9eff8;--muted:#98a8c1;--faint:#6f82a1;
  --primary:#5b95ff;--primary-fill:#0a63e8;--primary-soft:rgba(91,149,255,.14);
  --producing:#15803d;--stopped:#c81e2c;--setup:#0e7490;--planned:#fb923c;--rework:#7a2f00;--waiting:#f59e0b;--neutral:#5a6a85;--brand:#c84b00;--ink-dark:#0b1a33;--setup-tx:#3fd4ef;--setup-soft:rgba(14,116,144,.18);--planned-soft:rgba(251,146,60,.13);--rework-tx:#ffb37a;--rework-soft:rgba(122,47,0,.35);--neutral-tx:#94a3b8;
  --ok:#4ade80;--ok-soft:rgba(74,222,128,.12);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);
  --err:#ff6b76;--err-soft:rgba(255,107,118,.13);--info:#7fb0ff;--info-soft:rgba(91,149,255,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05090f;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.frame{width:1920px;height:1080px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;margin:0 0 40px}
.tag{position:absolute;left:24px;bottom:10px;font-size:13px;color:var(--faint);letter-spacing:.04em}
/* header */
.hdr{height:72px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;background:var(--surface-alt);border-bottom:1px solid var(--divider)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#0a63e8,#14b8a6);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand b{font-size:15px;display:block}.brand small{font-size:11px;color:var(--muted)}
.clock{margin-left:28px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.clock small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.res{text-align:center}.res small{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.res b{font-size:26px}
.hdr-r{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.ico-btn{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.call{height:44px;padding:0 18px;border-radius:8px;background:var(--brand);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
/* body grid */
.main{flex:1;display:grid;grid-template-columns:1fr 600px;gap:24px;padding:24px 28px 40px;min-height:0}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--divider)}
.ph h2{font-size:17px;font-weight:700}.count{min-width:28px;height:24px;padding:0 8px;border-radius:12px;background:var(--surface-hi);color:var(--muted);font-size:13px;font-weight:700;display:inline-grid;place-items:center}
/* status band */
.status{flex:none;height:148px;border-radius:12px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:0 32px;position:relative;overflow:hidden}
.status .si{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.status .si svg{width:40px;height:40px}
.status .st{font-size:58px;font-weight:700;letter-spacing:.01em;line-height:1}
.status .sub{margin-top:10px;font-size:19px;opacity:.92}
.status .st{display:flex;align-items:baseline;min-width:0}.status .why{margin-left:22px;padding-left:22px;border-left:3px solid currentColor;font-size:42px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini .status .why{font-size:22px;margin-left:12px;padding-left:12px;border-left-width:2px}
.mini .s-planned .st{flex-wrap:wrap}.mini .s-planned .why{flex-basis:100%;margin:4px 0 0;padding:0;border:0}
.status .sub b{font-weight:700}
.status .tm{text-align:right}.status .tm small{display:block;font-size:14px;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.status .tm b{font-size:64px;font-variant-numeric:tabular-nums;line-height:1.05}
.s-producing{background:var(--producing)}.s-stopped{background:var(--stopped)}.s-setup{background:var(--setup)}.s-rework{background:var(--rework)}
.s-waiting{background:var(--waiting);color:#0b1a33}.s-waiting .si{background:rgba(11,26,51,.12)}
.s-neutral{background:var(--neutral)}
.s-planned{color:var(--ink-dark)}.s-planned .si{background:rgba(11,26,51,.12)}
.s-planned{background:var(--planned)}
.s-stopped .reason{display:inline-block;margin-left:10px;padding:4px 12px;border-radius:6px;background:rgba(0,0,0,.22);font-weight:700}
/* running OPs strip */
.run{flex:none;display:flex;gap:12px}
.runl{flex:none;width:120px;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1.4}
.runl b{font-size:28px;color:var(--text);letter-spacing:0}
.tile{flex:1;min-width:0;height:96px;border-radius:10px;background:var(--surface);border:1px solid var(--border);padding:12px 16px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;column-gap:12px;position:relative}
.tile .op::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle}
.tile .op{font-size:20px;font-weight:700}.tile .d{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .q{white-space:nowrap;font-size:14px;color:var(--muted)}.tile .q b{color:var(--text);font-size:16px}
.tile .t{grid-column:2;grid-row:1/span 2;white-space:nowrap;text-align:right;font-size:13px;color:var(--muted)}.tile .t b{display:block;font-size:22px;color:var(--text);font-variant-numeric:tabular-nums}
.tile.focus{border:2px solid var(--primary);background:var(--surface-hi);box-shadow:0 0 0 4px var(--primary-soft)}
.tile.focus .fx{position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.06em}
.tile.off{background:var(--surface-alt);border-style:dashed}.tile.off .op::before{background:var(--faint)}.tile.off .op,.tile.off .q b,.tile.off .t b{color:var(--muted)}
/* OP panel */
.oppanel{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px;gap:18px}
.scan{display:flex;gap:12px}
.inp{flex:1;height:64px;border-radius:10px;border:2px solid var(--border-strong);background:var(--surface-alt);display:flex;align-items:center;gap:12px;padding:0 18px;font-size:24px;font-weight:700;letter-spacing:.02em}
.inp.ph-on{color:var(--faint);font-weight:400;font-size:21px}
.inp.focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.inp.bad{border-color:var(--err);box-shadow:0 0 0 4px var(--err-soft)}
.inp svg{width:28px;height:28px;color:var(--muted);flex:none}
.btn{height:64px;padding:0 24px;border-radius:10px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;border:1px solid transparent;white-space:nowrap}
.btn-p{background:var(--primary-fill)}.btn-g{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn-dis{background:var(--surface-alt);border-color:var(--divider);color:var(--faint)}
.oph{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.oph .opn{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.oph .opn b{color:var(--text);font-size:30px;letter-spacing:.01em;text-transform:none;margin-left:8px}
.oph .prod{margin-top:6px;font-size:22px}.oph .prod span{color:var(--muted);margin-left:10px;font-size:20px}
.pdf{height:48px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.pdf.no{color:var(--faint);border-style:dashed;font-weight:400}
/* route */
.route{display:flex;align-items:stretch;gap:0;padding:4px 0}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;min-width:0}
.step::after{content:"";position:absolute;top:22px;left:calc(50% + 28px);right:calc(-50% + 28px);height:4px;border-radius:2px;background:var(--border)}
.step:last-child::after{display:none}
.step.done::after{background:var(--ok)}
.dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:700;border:3px solid var(--border-strong);background:var(--surface-alt);color:var(--muted);z-index:1}
.step.done .dot{background:var(--producing);border-color:var(--producing);color:#fff}
.step.cur .dot{width:56px;height:56px;margin-top:-4px;background:var(--primary-fill);border-color:#a9c8ff;color:#fff;box-shadow:0 0 0 6px var(--primary-soft)}
.step.blk .dot{border-style:dashed}
.step .nm{margin-top:10px;font-size:18px;font-weight:700}
.step .sl{margin-top:4px;font-size:14px;color:var(--muted)}
.step.cur .nm{color:#fff;font-size:20px}.step.cur .sl{color:var(--primary);font-weight:700}
.step.done .sl{color:var(--ok)}
.step:not(.done):not(.cur) .nm{color:var(--muted)}
/* quantities */
.qty{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qb{background:var(--surface-alt);border:1px solid var(--divider);border-radius:10px;padding:14px 18px}
.qb small{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.qb b{display:block;font-size:40px;margin-top:4px;font-variant-numeric:tabular-nums}
.qb.g b{color:var(--ok)}.qb.r b{color:var(--err)}.qb.s{border-color:var(--border-strong)}
.bar{height:10px;border-radius:5px;background:var(--divider);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.barl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted)}
.empty svg{width:96px;height:96px;color:var(--border-strong)}
.empty h3{font-size:30px;color:var(--text);margin-top:14px}.empty p{font-size:19px;margin-top:8px}
/* message slot */
.msg{flex:none;height:68px;border-radius:10px;display:flex;align-items:center;gap:14px;padding:0 20px;font-size:19px;border:1px solid}
.msg svg{width:30px;height:30px;flex:none}
.msg b{font-weight:700}.msg .act{margin-left:auto;font-size:16px;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid currentColor;white-space:nowrap}
.m-info{background:var(--info-soft);border-color:rgba(91,149,255,.4);color:#cfe0ff}.m-info svg{color:var(--info)}
.m-ok{background:var(--ok-soft);border-color:rgba(74,222,128,.4);color:#d2f7df}.m-ok svg{color:var(--ok)}
.m-warn{background:var(--warn-soft);border-color:rgba(251,191,36,.45);color:#ffeab0}.m-warn svg{color:var(--warn)}
.m-err{background:var(--err-soft);border-color:rgba(255,107,118,.5);color:#ffd5d9}.m-err svg{color:var(--err)}
.m-setup{background:var(--setup-soft);border-color:rgba(63,212,239,.45);color:#d6f6fc}.m-setup svg{color:var(--setup-tx)}
.m-rework{background:var(--rework-soft);border-color:#a8501a;color:#f3dcc8}.m-rework svg{color:var(--rework-tx)}
.m-none{border:1px dashed var(--divider);color:var(--faint);font-size:16px;justify-content:center}
/* action bar */
.acts{flex:none;display:grid;grid-template-columns:repeat(5,1fr) 200px;gap:12px}
.ab{height:112px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:21px;font-weight:700;color:#fff;position:relative}
.ab svg{width:34px;height:34px}
.a-start{background:var(--producing)}.a-setup{background:var(--setup)}.a-stop{background:var(--stopped)}.a-rework{background:var(--rework)}.a-finish{background:var(--waiting);color:var(--ink-dark)}
.a-int{background:transparent;border:2px solid var(--border-strong);color:var(--text);font-size:18px}
.ab.dis{background:var(--surface-alt);border:1px solid var(--divider);color:#4d5f7d}
.ab.dis small{position:absolute;bottom:10px;font-size:12px;font-weight:400;color:var(--faint)}
.ab.hint{outline:4px solid var(--warn);outline-offset:3px}
/* right rail */
.people{flex:none}
.pl{padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{height:52px;border-radius:26px;background:var(--surface-hi);border:1px solid var(--border-strong);display:flex;align-items:center;gap:10px;padding:0 8px 0 6px;font-size:17px;font-weight:700}
.chip .av{width:40px;height:40px;border-radius:50%;background:var(--primary-fill);display:grid;place-items:center;font-size:16px}
.chip small{font-size:13px;color:var(--muted);font-weight:400;margin-left:-4px}
.chip .x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface-alt)}
.chip.off{background:transparent;border-style:dashed;color:var(--muted)}.chip.off .av{background:var(--neutral)}
.addb{flex:1;min-width:200px;height:52px;border-radius:26px;border:2px dashed var(--border-strong);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--muted);font-size:16px}
.addb svg{width:22px;height:22px}
.lists{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:8px;gap:8px;border-bottom:1px solid var(--divider)}
.tab{height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--surface-hi);color:var(--text);box-shadow:inset 0 -3px 0 var(--primary)}
.cards{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.more{flex:none;height:52px;border-top:1px solid var(--divider);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--primary)}
.card{border-radius:10px;border:1px solid var(--border);background:var(--surface-alt);padding:12px 16px;display:grid;grid-template-columns:1fr auto;row-gap:4px;position:relative}
.card .op{font-size:20px;font-weight:700}
.card .ln{grid-column:1/-1;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ln b{color:var(--text)}
.card .qq{grid-column:1/-1;display:flex;gap:18px;font-size:15px;color:var(--muted);margin-top:2px}.card .qq b{color:var(--text);font-size:17px}
.card .qq .g{color:var(--ok)}.card .qq .r{color:var(--err)}
.pill{height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-self:end;border:1px solid}
.p-wait{color:var(--text);border-color:var(--border-strong);background:var(--surface-hi)}
.p-warn{color:#ffe08a;border-color:rgba(251,191,36,.5);background:var(--warn-soft)}
.p-run{color:#fff;border-color:var(--producing);background:var(--producing)}
.p-done{color:#a7f3c0;border-color:rgba(74,222,128,.5);background:var(--ok-soft)}
.p-blk{color:var(--muted);border-color:var(--border-strong);background:transparent}
.p-err{color:#ffd5d9;border-color:rgba(255,107,118,.5);background:var(--err-soft)}
.p-part{color:#cfe0ff;border-color:rgba(91,149,255,.45);background:var(--info-soft)}
.card.sel{border:2px solid var(--primary);background:var(--surface-hi);box-shadow:0 0 0 4px var(--primary-soft)}
.card.sel .op::before{content:"✓ ";color:var(--primary)}
.card.off{opacity:.55;border-style:dashed}
.card .why{grid-column:1/-1;font-size:14px;color:var(--warn);margin-top:2px}
/* modal */
.veil{position:absolute;inset:0;background:rgba(3,7,14,.72);display:grid;place-items:center;z-index:5}
.modal{width:880px;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.mh{padding:24px 28px 18px;border-bottom:1px solid var(--divider)}
.mh small{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.mh h2{font-size:30px;margin-top:6px}
.mb{padding:22px 28px;display:flex;flex-direction:column;gap:18px}
.mb .inp{flex:none}
.mini .status .st{white-space:nowrap;font-size:30px}
.mf{padding:18px 28px;border-top:1px solid var(--divider);display:flex;justify-content:space-between;gap:12px}
.mf .btn{height:68px;font-size:20px;padding:0 32px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rs{height:84px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-alt);display:flex;flex-direction:column;justify-content:center;padding:0 18px;font-size:19px;font-weight:700}
.rs small{font-size:14px;color:var(--muted);font-weight:400;margin-top:4px}
.rs.on{border:2px solid var(--err);background:var(--err-soft)}
.rs.rsp{border-color:rgba(251,146,60,.55);background:var(--planned-soft)}.rs.rsp small{color:var(--planned)}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;height:88px;border-radius:12px;border:2px solid var(--border-strong);overflow:hidden}
.stepper span{display:grid;place-items:center;font-size:34px;font-weight:700;background:var(--surface-hi)}
.stepper b{display:grid;place-items:center;font-size:44px;background:var(--surface-alt)}
.fld small{display:block;font-size:15px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sum{display:flex;justify-content:space-between;font-size:19px;padding:14px 18px;border-radius:10px;background:var(--surface-alt);border:1px solid var(--divider)}
.sum b{font-size:22px}
/* component sheets */
.sheet{flex:1;padding:36px 44px;display:grid;gap:28px;min-height:0}
.sheet h1{font-size:31px}.sheet h1 small{display:block;font-size:16px;color:var(--muted);font-weight:400;margin-top:6px}
.sec h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.cap{font-size:14px;color:var(--faint);margin-top:8px;line-height:1.35}
.mini .status{height:96px;padding:0 22px;gap:16px}.mini .status .st{font-size:30px}.mini .status .sub{font-size:15px;margin-top:6px}
.mini .status .si{width:52px;height:52px}.mini .status .si svg{width:28px;height:28px}.mini .status .tm b{font-size:30px}.mini .status .tm small{font-size:11px}
/* v2: esqueleto fixo — status, leitura da OP, OP em destaque, botões, avisos, roteiro */
.main{gap:20px;padding:20px 28px 34px}.col{gap:14px}
.status{height:112px}.status .st{font-size:50px}.status .tm b{font-size:56px}.status .si{width:64px;height:64px}.status .si svg{width:34px;height:34px}.status .sub{margin-top:8px;font-size:18px}
.scanbar{flex:none;display:flex;gap:12px;align-items:center;padding:10px;background:var(--surface);border:2px solid var(--border-strong);border-radius:12px}
.slab{flex:none;width:190px;display:flex;align-items:center;gap:12px;padding-left:8px;font-size:20px;font-weight:700}
.slab svg{width:40px;height:40px;color:var(--primary);flex:none}.slab small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.scanbar .inp{height:64px}.scanbar .btn{height:64px}
.hero{flex:none;height:150px;display:grid;grid-template-columns:1.4fr 1.6fr 1.05fr 1fr;padding:0}
.ab{gap:6px}.ab.dis small{position:static;margin-top:-4px}
.hc{padding:18px 22px;border-left:1px solid var(--divider);min-width:0;display:flex;flex-direction:column;gap:4px}
.hc:first-child{border-left:0}
.hc small{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hc .big{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}.hc .big i{font-style:normal;font-size:22px;color:var(--muted)}
.hc .mid{font-size:32px;line-height:1.15;white-space:nowrap}
.hc span{font-size:17px;color:var(--muted)}.hc span b{color:var(--text)}
.hc .desc{font-size:20px;color:var(--text);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-empty{display:grid;place-items:center;text-align:center;border-style:dashed}
.hero-empty>div{display:flex;flex-direction:column;align-items:center;gap:6px}.hero-empty svg{width:44px;height:44px;color:var(--border-strong)}
.hero-empty b{font-size:24px}.hero-empty span{font-size:17px;color:var(--muted)}
.hero-blk{border-color:rgba(255,107,118,.5)}
.acts{grid-template-columns:repeat(5,1fr) 190px}.ab{height:104px}
.routep{flex:1;min-height:0;display:flex;flex-direction:column}
.routep .ph{padding:10px 18px}.routep .pdf{height:40px}
.rbody{flex:1;display:flex;align-items:center;padding:8px 24px}.rbody .route{flex:1}
.rempty{flex:1;text-align:center;color:var(--faint);font-size:18px}
.card .when{margin-left:auto;font-size:14px}
/* setup popup */
.mh-setup{background:var(--setup);border-bottom:0}.mh-setup small{color:#cdeef5}
.ctx{display:grid;grid-template-columns:1fr 1.6fr .6fr .9fr;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt)}
.ctx>div{padding:12px 16px;border-left:1px solid var(--divider);display:flex;flex-direction:column;gap:2px;min-width:0}.ctx>div:first-child{border-left:0}
.ctx small{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.ctx b{font-size:22px}.ctx span{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sclock{text-align:center;padding:14px 0 6px}.sclock small{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.sclock b{display:block;font-size:96px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--setup-tx)}.sclock span{font-size:15px;color:var(--faint)}
.ssteps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ssteps>div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--divider);background:var(--surface-alt)}
.ssteps i{font-style:normal;width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--border-strong);color:var(--muted)}
.ssteps b{display:block;font-size:17px}.ssteps span{font-size:14px;color:var(--muted)}
.ssteps .on{border-color:var(--setup-tx);background:var(--setup-soft)}.ssteps .on i{background:var(--setup);border-color:var(--setup-tx);color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script>
const I = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5.2 5.2l-8.6 8.6a2.1 2.1 0 0 1-3-3z"/><path d="M14.7 6.3 17 4l3 3-2.3 2.3"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.5v7M14 8.5v7"/></svg>',
  redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v5h5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>',
  tick:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  stopsq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
  badge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16a3.4 3.4 0 0 1 6.4 0M14.5 10h4M14.5 13.5h3"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2 18.5A2 2 0 0 0 3.7 21.5h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5M12 17.5h.01"/></svg>',
  err:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="m9 9 6 6M15 9l-6 6"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5h.01"/></svg>',
  okc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>',
  pdf:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  bell:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  out:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
  help:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3 2"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7.5h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></svg>',
};

const hdr = (res="Dobra · 1303") => `
<div class="hdr">
  <div class="brand"><div class="logo">GP</div><div><b>Gestor de Peças</b><small>Posto do operador</small></div><div class="clock">11:10<small>12/11/2026 · Turno 1</small></div></div>
  <div class="res"><small>Recurso</small><b>${res}</b></div>
  <div class="hdr-r"><div class="call">${I.bell} Chamar</div><div class="ico-btn">${I.help}</div><div class="ico-btn">${I.moon}</div><div class="ico-btn">${I.out}</div></div>
</div>`;

const ST = {
  producing:{t:"PRODUZINDO",i:I.play},stopped:{t:"PARADO",i:I.pause},setup:{t:"SETUP",i:I.wrench},
  rework:{t:"RETRABALHO",i:I.redo},waiting:{t:"SEM APONTAMENTO",i:I.clock},neutral:{t:"FORA DO TURNO",i:I.clock},planned:{t:"PARADA PLANEJADA",i:I.pause},
};
const status = (k, sub, timer, tlabel="neste estado há", title, why) => `
<div class="status s-${k}">
  <div class="si">${ST[k].i}</div>
  <div style="min-width:0"><div class="st">${title||ST[k].t}${why?`<span class="why">${why}</span>`:""}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>
  <div class="tm">${timer?`<small>${tlabel}</small><b>${timer}</b>`:""}</div>
</div>`;

const tile = (o) => `
<div class="tile ${o.focus?"focus":""} ${o.off?"off":""}">
  <div class="op">${o.op}</div>
  <div class="t">${o.off?"interrompida":"tempo na OP"}<b>${o.time}</b></div>
  <div class="d">${o.desc}</div>
  <div class="q">Boas <b>${o.g}</b> de ${o.p} · Refugo <b>${o.r}</b></div>
  ${o.focus?'<div class="fx">Em foco</div>':""}
</div>`;
const runStrip = (items) => `<div class="run"><div class="runl">No posto agora<b>${items.length} OP${items.length>1?"s":""}</b></div>${items.map(tile).join("")}</div>`;

const ROUTE = [
  {n:"10",nm:"CORTE",sl:"Concluída",s:"done"},
  {n:"20",nm:"DOBRA",sl:"Você está aqui",s:"cur"},
  {n:"30",nm:"SOLDA",sl:"Próxima",s:""},
  {n:"40",nm:"PINTURA",sl:"Depois",s:""},
  {n:"99",nm:"FINALIZADA",sl:"Fim",s:""},
];
const route = (r=ROUTE) => `<div class="route">${r.map(s=>`<div class="step ${s.s}"><div class="dot">${s.s==="done"?I.tick:s.n}</div><div class="nm">${s.n} · ${s.nm}</div><div class="sl">${s.sl}</div></div>`).join("")}</div>`;

const qty = (p,g,r) => { const s=p-g-r; const pg=g/p*100, pr=r/p*100; return `
<div>
<div class="qty">
  <div class="qb"><small>Planejado</small><b>${p}</b></div>
  <div class="qb g"><small>Boas</small><b>${g}</b></div>
  <div class="qb r"><small>Refugo</small><b>${r}</b></div>
  <div class="qb s"><small>Falta</small><b>${s}</b></div>
</div>
<div style="margin-top:14px" class="bar"><i style="width:${pg}%;background:var(--ok)"></i><i style="width:${pr}%;background:var(--err)"></i></div>
<div class="barl"><span>${Math.round((g+r)/p*100)}% apontado</span><span>${s} peça${s===1?"":"s"} para terminar a OP</span></div>
</div>`;};

const scan = (val, cls="") => `<div class="scanbar">
  <div class="slab">${I.scan}<div>Leia a OP<small>leitor ou teclado</small></div></div>
  <div class="inp ${val?"":"ph-on"} ${cls}">${val||"Aponte o leitor para a etiqueta da OP ou digite o código"}</div>
  <div class="btn btn-p">Carregar roteiro</div>
</div>`;

// Cartão principal da OP: OP, peça, quantidade e tempo sempre no mesmo lugar e grandes.
const hero = (o) => {
  if (!o) return `<div class="panel hero hero-empty"><div>${I.inbox}<b>Nenhuma OP carregada</b><span>Leia a OP no campo acima ou toque numa OP da fila ao lado.</span></div></div>`;
  const s = o.p - o.g - o.r, pg = o.g/o.p*100, pr = o.r/o.p*100;
  return `<div class="panel hero ${o.blk?"hero-blk":""}">
  <div class="hc"><small>OP</small><b class="big">${o.op}</b><span>Operação <b>${o.oper||"20 · DOBRA"}</b></span></div>
  <div class="hc"><small>Peça</small><b class="mid">${o.prod}</b><span class="desc">${o.desc}</span></div>
  <div class="hc"><small>Quantidade</small><b class="big">${o.p}<i> pç</i></b>
    <span>Boas <b style="color:var(--ok)">${o.g}</b> · Refugo <b style="color:var(--err)">${o.r}</b> · Falta <b>${s}</b></span>
    <div class="bar" style="margin-top:8px"><i style="width:${pg}%;background:var(--ok)"></i><i style="width:${pr}%;background:var(--err)"></i></div></div>
  <div class="hc"><small>${o.tl||"Tempo na OP"}</small><b class="big">${o.time||"—"}</b><span>${o.since||"Ainda não iniciada"}</span></div>
</div>`;
};

const routePanel = (r, pdf=true) => `<div class="panel routep">
  <div class="ph"><h2>Roteiro da OP</h2><div class="pdf ${pdf?"":"no"}">${I.pdf}${pdf?"Ver desenho (PDF)":"Sem desenho"}</div></div>
  <div class="rbody">${r===null?`<div class="rempty">O roteiro aparece aqui depois de ler a OP.</div>`:route(r)}</div>
</div>`;

const msg = (tone, html, act) => tone==="none" ? `<div class="msg m-none">Avisos e erros aparecem aqui</div>` :
  `<div class="msg m-${tone}">${{info:I.info,ok:I.okc,warn:I.warn,err:I.err,setup:I.wrench,rework:I.redo}[tone]}<div>${html}</div>${act?`<div class="act">${act}</div>`:""}</div>`;

const A = {start:["a-start",I.play,"Iniciar"],setup:["a-setup",I.wrench,"Setup"],stop:["a-stop",I.pause,"Parada"],rework:["a-rework",I.redo,"Retrabalho"],finish:["a-finish",I.check,"Finalizar"]};
const acts = (on, opts={}) => `<div class="acts">${Object.keys(A).map(k=>{const [c,i,l]=A[k]; const lab = (k==="stop"&&opts.stopLabel)?opts.stopLabel:(opts.labels&&opts.labels[k])||l; const isOn=on.includes(k);
  const cc = k==="finish"&&/Setup/.test(lab)?"a-setup":k==="finish"&&/Ret/.test(lab)?"a-rework":c;
  return `<div class="ab ${isOn?cc:"dis"} ${opts.hint===k?"hint":""}">${i}${lab}${!isOn&&opts.why&&opts.why[k]?`<small>${opts.why[k]}</small>`:""}</div>`}).join("")}
  <div class="ab ${opts.int?"a-int":"dis"}">${I.stopsq}Interromper OP</div></div>`;

const people = (list, add=true) => `<div class="panel people"><div class="ph"><h2>Pessoas no recurso</h2><span class="count">${list.filter(p=>!p.off).length}</span></div>
<div class="pl">${list.map(p=>`<div class="chip ${p.off?"off":""}"><div class="av">${p.n[0]}</div>${p.n}<small>crachá ${p.c}</small><div class="x">✕</div></div>`).join("")}${add?`<div class="addb">${I.badge}Passe o crachá para entrar</div>`:""}
${list.length===0?'<div style="width:100%;font-size:14px;color:var(--faint)">Ninguém no recurso. O crachá é pedido ao iniciar.</div>':""}</div></div>`;

const card = (c) => `<div class="card ${c.sel?"sel":""} ${c.off?"off":""}">
  <div class="op">OP ${c.op}</div><span class="pill ${c.pc}">${c.pt}</span>
  <div class="ln"><b>${c.prod}</b> · ${c.desc}</div>
  <div class="qq"><span>Qtd <b>${c.q}</b></span><span>Boas <b class="g">${c.g}</b></span><span>Refugo <b class="r">${c.r}</b></span><span class="when">${c.when||c.oper}</span></div>
  ${c.why?`<div class="why">${c.why}</div>`:""}
</div>`;

const FILA = [
  {op:"PCMHQI01001",pc:"p-wait",pt:"Aguardando",oper:"20 · DOBRA",prod:"ICG010002021A",desc:"Suporte para transporte (pintura)",q:2,g:0,r:0,when:"entrou 12/11 07:40"},
  {op:"PCMHYG01002",pc:"p-wait",pt:"Aguardando",oper:"20 · DOBRA",prod:"PPM014001113",desc:"Proteção caracol inferior dir.",q:1,g:0,r:0,when:"entrou 12/11 08:05"},
  {op:"PCMJ0A01004",pc:"p-part",pt:"Parcial 3/8",oper:"20 · DOBRA",prod:"PCG008002118",desc:"Chapa lateral esq. sobrecaixa",q:8,g:3,r:0,when:"últ. apont. 11/11 16:20"},
  {op:"PCMK2201001",pc:"p-warn",pt:"Bloqueada",oper:"20 · DOBRA",prod:"PPCX03001060",desc:"Base inferior chassi (9,5 mm)",q:4,g:0,r:0,off:true,why:"Aguardando a etapa 10 · CORTE terminar"},
];
const HIST = [
  {op:"00601315015",pc:"p-done",pt:"Finalizada",oper:"30 · DOBRA",prod:"PPCX03001052",desc:"Base inferior chassi (9,5 mm)",q:1,g:1,r:0,when:"hoje 09:25 · 0h 42min"},
  {op:"PCLN5301021",pc:"p-done",pt:"Finalizada",oper:"20 · DOBRA",prod:"PPM014001127",desc:"Fechamento coluna",q:1,g:1,r:0,when:"ontem 13:39 · 1h 05min"},
  {op:"PCLM8801003",pc:"p-err",pt:"Com refugo",oper:"20 · DOBRA",prod:"PCG008002101",desc:"Reforço longarina",q:6,g:5,r:1,when:"ontem 10:02 · 2h 10min"},
  {op:"PCLL1201007",pc:"p-blk",pt:"Interrompida",oper:"20 · DOBRA",prod:"ICG010002044",desc:"Tampa do painel elétrico",q:10,g:4,r:0,when:"10/11 15:40 · 09:12",off:true,why:"Volta para a fila quando alguém iniciar de novo"},
];
const lists = (tab="fila", fila=FILA, hist=HIST, selOp) => {
  const items = (tab==="fila"?fila:hist).map(c=>({...c, sel:c.op===selOp}));
  return `<div class="panel lists"><div class="tabs"><div class="tab ${tab==="fila"?"on":""}">Fila de ordens <span class="count">${fila.length}</span></div><div class="tab ${tab==="hist"?"on":""}">Histórico <span class="count">${hist.length}</span></div></div>
  <div class="cards">${items.map(card).join("")}</div><div class="more">Ver todas (${tab==="fila"?fila.length+3:hist.length+2}) →</div></div>`;
};

const screen = (n, title, left, right, overlay="") => `<section class="frame" data-file="${n}">${hdr()}<div class="main"><div class="col">${left}</div><div class="col">${right}</div></div>${overlay}<div class="tag">${n} · ${title}</div></section>`;

// Esqueleto fixo da coluna principal: nada muda de lugar entre os estados.
const L = (o) => o.status + scan(o.scanVal, o.scanCls) + (o.run||"") + hero(o.op) + o.acts + (o.msg||msg("none")) + routePanel(o.route===undefined?R4:o.route);

const P1 = [{n:"Iago",c:"2"}];
const P2 = [{n:"Iago",c:"2"},{n:"Marcos",c:"17"}];
const R4 = [{n:"10",nm:"CORTE",sl:"Concluída",s:"done"},{n:"20",nm:"DOBRA",sl:"Você está aqui",s:"cur"},{n:"30",nm:"SOLDA",sl:"Próxima",s:""},{n:"99",nm:"FINALIZADA",sl:"Fim",s:""}];

const OPQ = {op:"PCMHQI01001",prod:"ICG010002021A",desc:"Suporte para transporte (pintura)",p:2,g:0,r:0};
const OPC = (g=0,time="2h 31min") => ({op:"PCMCY901001",prod:"PCG008002114",desc:"Chapa lateral dir. sobrecaixa",p:2,g,r:0,time,since:"Início 12/11 às 08:39"});
const idle = (t) => status("waiting","",t,"parado sem OP há");
const NOOP = {start:"leia uma OP",setup:"leia uma OP",rework:"leia uma OP",finish:"nada em produção"};

const F = [];

F.push(screen("01_posto_livre","Posto livre, nenhuma OP carregada",
  L({status:idle("00:12:40"), scanCls:"focus", op:null, route:null,
     acts:acts(["stop"],{stopLabel:"Parada do posto",why:NOOP})}),
  people([]) + lists("fila")));

F.push(screen("02_op_carregada_roteiro","OP carregada: OP, peça, quantidade, roteiro e aviso de Setup",
  L({status:idle("00:13:05"), scanVal:"PCMHQI01001", op:OPQ,
     acts:acts(["setup","stop","rework"],{hint:"setup",why:{start:"depois do Setup",finish:"nada em produção"}}),
     msg:msg("warn","<b>Faça o Setup primeiro.</b>","Abrir Setup")}),
  people(P1) + lists("fila", FILA, HIST, "PCMHQI01001")));

F.push(screen("03_cracha_ao_iniciar","Crachá: quem vai trabalhar nesta OP",
  L({status:idle("00:13:40"), scanVal:"PCMHQI01001", op:OPQ, acts:acts(["start","setup","stop","rework"])}),
  people(P1) + lists("fila", FILA, HIST, "PCMHQI01001"),
  `<div class="veil"><div class="modal">
    <div class="mh"><small>Setup · OP PCMHQI01001 · 20 · DOBRA</small><h2>Quem vai trabalhar nesta OP?</h2></div>
    <div class="mb">
      <div class="inp focus" style="height:80px;font-size:24px;color:var(--faint);font-weight:400">${I.badge}Passe o crachá no leitor ou digite o número</div>
      <div class="fld"><small>Já estão no recurso</small>
        <div class="pl" style="padding:0">
          <div class="chip" style="border-color:var(--ok);background:var(--ok-soft)"><div class="av" style="background:var(--producing)">✓</div>Iago<small>crachá 2</small></div>
          <div class="chip" style="border-color:var(--ok);background:var(--ok-soft)"><div class="av" style="background:var(--producing)">✓</div>Marcos<small>crachá 17</small><div class="x">✕</div></div>
        </div></div>
      ${msg("info","Pelo menos <b>1 crachá</b> é obrigatório.")}
    </div>
    <div class="mf"><div class="btn btn-g">Cancelar</div><div class="btn" style="background:var(--setup)">${I.wrench.replace('<svg','<svg width="26" height="26"')}Começar Setup com 2 pessoas</div></div>
  </div></div>`));

F.push(screen("04_setup_popup_ferramental","Popup do Setup Ferramental (abre logo depois do crachá)",
  L({status:status("setup","","00:00:41"), scanVal:"PCMHQI01001",
     op:{...OPQ,tl:"Tempo de setup",time:"0h 00min",since:"Início 12/11 às 10:58"},
