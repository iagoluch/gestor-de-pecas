# nginx para Windows na frente do Uvicorn (127.0.0.1:8000). Instalado por
# deploy/instalar_vm.ps1 em <nginx>\conf\nginx.conf; certificados em conf\certs.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    upstream gestor {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate      certs/gestor-pecas.crt;
        ssl_certificate_key  certs/gestor-pecas.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # Upload de desenho da Qualidade: 20 MB em base64 (+1/3) com folga.
        # O limite fino por rota continua no app (backend/api/body_limit.py).
        client_max_body_size 32m;

        location / {
            proxy_pass http://gestor;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # $remote_addr sobrescreve o que o cliente mandou: o Uvicorn confia
            # neste cabeçalho vindo de 127.0.0.1 e o usa como IP de origem
            # (allowlist SOAP do TOTVS e freio de login por IP).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SSE (painéis ao vivo e IA): sem buffer e sem corte por inatividade.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
